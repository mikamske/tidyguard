[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "tidyguard"
version = "0.1.0"
description = "Keep coding agents from leaving notes, rewritten specs, unrequested automation and leftovers behind"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Mika Mischke"}]
keywords = ["agents", "claude-code", "codex", "opencode", "hooks", "git", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mikamske/tidyguard"
Issues = "https://github.com/mikamske/tidyguard/issues"

[project.scripts]
tidyguard = "tidyguard.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.16.10", "mypy==2.4.0", "coverage==7.16.2", "build==1.6.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/tidyguard"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["tidyguard"]

[tool.coverage.report]
show_missing = true
